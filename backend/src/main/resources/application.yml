spring:
  application:
    name: resumint
  main:
    banner-mode: off
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/resumint?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:resumint}
    password: ${DB_PASSWORD:resumint}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${ALERT_EMAIL_SMTP_HOST:smtp.163.com}
    port: ${ALERT_EMAIL_SMTP_PORT:465}
    username: ${ALERT_EMAIL_USERNAME:}
    password: ${ALERT_EMAIL_AUTHORIZATION_CODE:}
    properties:
      "mail.smtp.auth": true
      "mail.smtp.ssl.enable": true
      "mail.smtp.connectiontimeout": ${ALERT_EMAIL_CONNECTION_TIMEOUT_MS:5000}
      "mail.smtp.timeout": ${ALERT_EMAIL_READ_TIMEOUT_MS:5000}
      "mail.smtp.writetimeout": ${ALERT_EMAIL_WRITE_TIMEOUT_MS:5000}

mybatis:
  type-handlers-package: com.resumint.persistence
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${PORT:8080}

resumint:
  admin:
    phone: ${RESUMINT_ADMIN_PHONE:}
    mode: ${RESUMINT_ADMIN_MODE:none}
    confirmation: ${RESUMINT_ADMIN_CONFIRMATION:}
  auth:
    session-ttl: ${AUTH_SESSION_TTL:30d}
    trusted-device-ttl: ${AUTH_TRUSTED_DEVICE_TTL:180d}
    inactivity-risk-age: ${AUTH_INACTIVITY_RISK_AGE:180d}
    password-min-length: ${AUTH_PASSWORD_MIN_LENGTH:6}
    password-max-length: ${AUTH_PASSWORD_MAX_LENGTH:72}
    phone-lookup-secret: ${AUTH_PHONE_LOOKUP_SECRET:dev-only-phone-lookup-secret-change-me}
    phone-lookup-secrets: ${AUTH_PHONE_LOOKUP_SECRETS:${resumint.auth.phone-lookup-secret}}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  sms:
    provider: ${SMS_PROVIDER:disabled}
    endpoint: ${ALIBABA_CLOUD_DYPNS_ENDPOINT:dypnsapi.aliyuncs.com}
    sign-name: ${ALIBABA_CLOUD_SMS_SIGN_NAME:}
    login-template-code: ${ALIBABA_CLOUD_SMS_LOGIN_TEMPLATE_CODE:}
    password-reset-template-code: ${ALIBABA_CLOUD_SMS_PASSWORD_RESET_TEMPLATE_CODE:}
    phone-change-old-template-code: ${ALIBABA_CLOUD_SMS_PHONE_CHANGE_OLD_TEMPLATE_CODE:}
    phone-change-new-template-code: ${ALIBABA_CLOUD_SMS_PHONE_CHANGE_NEW_TEMPLATE_CODE:}
    scheme-name: ${ALIBABA_CLOUD_SMS_SCHEME_NAME:}
    code-minutes: ${SMS_CODE_MINUTES:5}
    cooldown: ${SMS_COOLDOWN:60s}
    attempt-ttl: ${SMS_ATTEMPT_TTL:10m}
    phone-hour-limit: ${SMS_PHONE_HOUR_LIMIT:5}
    phone-day-limit: ${SMS_PHONE_DAY_LIMIT:10}
    source-hour-limit: ${SMS_SOURCE_HOUR_LIMIT:20}
    device-hour-limit: ${SMS_DEVICE_HOUR_LIMIT:10}
    session-hour-limit: ${SMS_SESSION_HOUR_LIMIT:10}
    global-minute-limit: ${SMS_GLOBAL_MINUTE_LIMIT:200}
    verify-failure-limit: ${SMS_VERIFY_FAILURE_LIMIT:5}
    daily-cost-warning-count: ${SMS_DAILY_COST_WARNING_COUNT:500}
  ops:
    token: ${RESUMINT_OPS_TOKEN:dev-only-ops-token-change-me}
  alert:
    email:
      enabled: ${ALERT_EMAIL_ENABLED:false}
      from: ${ALERT_EMAIL_FROM:}
      to: ${ALERT_EMAIL_TO:}
      poll-interval: ${ALERT_EMAIL_POLL_INTERVAL:30s}
      retry-delay: ${ALERT_EMAIL_RETRY_DELAY:5m}
      delivery-lease: ${ALERT_EMAIL_DELIVERY_LEASE:2m}
      max-attempts: ${ALERT_EMAIL_MAX_ATTEMPTS:3}
  resume:
    max-document-bytes: ${RESUME_MAX_DOCUMENT_BYTES:4194304}
  export:
    print-base-url: ${PRINT_BASE_URL:http://127.0.0.1:3100}
    worker-enabled: ${EXPORT_WORKER_ENABLED:false}
    worker-concurrency: ${EXPORT_WORKER_CONCURRENCY:1}
    queue-capacity: ${EXPORT_QUEUE_CAPACITY:20}
    max-snapshot-bytes: ${EXPORT_MAX_SNAPSHOT_BYTES:4194304}
    render-timeout: ${EXPORT_RENDER_TIMEOUT:45s}
    lease-duration: ${EXPORT_LEASE_DURATION:60s}
    result-retention: ${EXPORT_RESULT_RETENTION:15m}
    credential-ttl: ${EXPORT_CREDENTIAL_TTL:20m}
    orphan-grace: ${EXPORT_ORPHAN_GRACE:30m}
    credential-secret: ${EXPORT_CREDENTIAL_SECRET:dev-only-export-credential-secret-change-me}
    credential-secrets: ${EXPORT_CREDENTIAL_SECRETS:${resumint.export.credential-secret}}
    repository: mysql
    storage-root: ${EXPORT_STORAGE_ROOT:${java.io.tmpdir}/resumint-export}

springdoc:
  api-docs:
    path: /api/openapi.json
